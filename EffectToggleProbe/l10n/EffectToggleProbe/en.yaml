PageName: "Effect Toggle Probe"
PageDescription: "Throwaway diagnostic keys. Results go to openmw.log, lines starting with [EffectToggleProbe]."
GroupName: "Probe keys"
dumpName: "1. Dump report"
dumpDescription: "Log your active spells, constant effects and spellbook abilities."
methodAName: "2. Test A: remove the active spell"
methodADescription: "Removes whole spells that carry a target effect. Reload your save afterwards."
methodBName: "3. Test B: negative modifier"
methodBDescription: "Cancels each target effect with a negative modifier."
methodCName: "4. Test C: remove the active effect"
methodCDescription: "Removes each target effect from your active effects. Reload your save afterwards."
restoreName: "5. Restore the last test"
restoreDescription: "Tries to undo the last of tests 2-4."
flourishLocalName: "6. Flourish (attached to you)"
flourishLocalDescription: "Plays the enable then disable visual and sound attached to your character."
flourishWorldName: "7. Flourish (world spawn)"
flourishWorldDescription: "Same, spawned in the world at your position through the global script."
iconsName: "8. HUD icon test"
iconsDescription: "Draws the effect icons with a cross and a pulse for a few seconds."
